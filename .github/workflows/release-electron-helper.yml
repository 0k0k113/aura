name: Release Electron Helper

# Publishes a GitHub Release with signed installers for every platform.
#
# Previously releases were assembled by hand from CI artifacts. That is how an
# unsigned arm64 build reached users and produced macOS's
# "…is damaged and can't be opened" error — nothing in the pipeline ever checked
# that the bundle carried a valid signature. This workflow verifies the
# signature before the artifact is allowed anywhere near a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1). Created if it doesn't exist."
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: electron-helper

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json
      # `npm ci` runs Electron's postinstall, which downloads a ~100MB binary
      # over the network. That download is the flakiest step in the pipeline —
      # it has already failed a build on main with "RequestError: socket hang
      # up", and here it would take a release down with it. node_modules is
      # cleared between attempts because a half-finished install is not a
      # useful starting point for the next one.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3)"
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job builds BOTH architectures: electron-builder
          # cross-packages darwin-x64 on an Apple Silicon runner, and codesign
          # is arch-agnostic, so the Intel bundle is signed and verified here
          # too. A separate macos-13 job added nothing and queued forever —
          # GitHub is retiring that image.
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            artifact: macos
            command: npm run dist:mac
          - name: Windows
            os: windows-latest
            artifact: windows
            command: npm run dist:win
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            command: npm run dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json

      - name: Create .env from secret
        shell: bash
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: echo "DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}" > .env

      # `npm ci` runs Electron's postinstall, which downloads a ~100MB binary
      # over the network. That download is the flakiest step in the pipeline —
      # it has already failed a build on main with "RequestError: socket hang
      # up", and here it would take a release down with it. node_modules is
      # cleared between attempts because a half-finished install is not a
      # useful starting point for the next one.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3)"
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset GitHub secret arrives as an empty string, and
          # electron-builder reads a defined-but-empty CSC_LINK as "a
          # certificate is configured here", then fails resolving it as a path.
          # Drop the empty ones so it correctly sees no credentials.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done

          # electron-builder fetches its own toolchain (Electron itself, the
          # NSIS binaries, winCodeSign) from GitHub releases mid-build, through
          # a code path named DownloadNoRetry — so one EOF on a 1.3MB file ends
          # the whole build. That has already failed Windows on main:
          #   Get ".../nsis-resources-3.4.1.7z": EOF   at DownloadNoRetry
          # Retrying the build is the only place a retry can go, since the
          # download is buried inside it. Anything already fetched lands in
          # electron-builder's cache, so a second attempt has less to pull.
          for attempt in 1 2 3; do
            if ${{ matrix.command }}; then
              exit 0
            fi
            echo "build failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          echo "build failed after 3 attempts"
          exit 1

      - name: Verify macOS signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          found=0
          for APP in release/mac*/*.app; do
            [ -d "$APP" ] || continue
            found=$((found + 1))
            echo "── Verifying $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app bundle produced"
            exit 1
          fi
          APP=$(ls -d release/mac*/*.app | head -1)
          if codesign --display --verbose=2 "$APP" 2>&1 | grep -q "TeamIdentifier=not set"; then
            echo "::warning::Ad-hoc signed only (no Developer ID). Launches fine on Apple Silicon; browser downloads still need one approval via System Settings → Privacy & Security. The curl installer avoids that entirely. Add CSC_LINK + APPLE_* secrets to notarize."
          else
            echo "✅ Developer ID signed."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            electron-helper/release/*.dmg
            electron-helper/release/*.zip
            electron-helper/release/*.exe
            electron-helper/release/*.AppImage
            electron-helper/release/*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        working-directory: .
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        working-directory: .
        run: ls -la artifacts

      - name: Publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          NOTES: electron-helper/RELEASE_NOTES.md
        run: |
          # The install instructions live in the repo (RELEASE_NOTES.md), not in
          # a heredoc buried in CI, so rewriting them is a normal reviewable
          # change to a markdown file.
          #
          # `gh release edit` on the existing-release path is the load-bearing
          # half. Every build reuses one tag, so `gh release create` runs exactly
          # once in the life of that tag — which meant the notes froze at whatever
          # the FIRST run published and every later rewrite reached the repo but
          # never the release page. Uploading assets without also pushing the
          # notes is how the page ended up describing only macOS long after
          # Windows and Linux builds were shipping beside it.
          test -f "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file "$NOTES"
          fi
