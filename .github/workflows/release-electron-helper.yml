name: Release Electron Helper

# Publishes a GitHub Release with signed installers for every platform.
#
# Previously releases were assembled by hand from CI artifacts. That is how an
# unsigned arm64 build reached users and produced macOS's
# "…is damaged and can't be opened" error — nothing in the pipeline ever checked
# that the bundle carried a valid signature. This workflow verifies the
# signature before the artifact is allowed anywhere near a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1). Created if it doesn't exist."
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: electron-helper

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json
      # `npm ci` runs Electron's postinstall, which downloads a ~100MB binary
      # over the network. That download is the flakiest step in the pipeline —
      # it has already failed a build on main with "RequestError: socket hang
      # up", and here it would take a release down with it. node_modules is
      # cleared between attempts because a half-finished install is not a
      # useful starting point for the next one.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3)"
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job builds BOTH architectures: electron-builder
          # cross-packages darwin-x64 on an Apple Silicon runner, and codesign
          # is arch-agnostic, so the Intel bundle is signed and verified here
          # too. A separate macos-13 job added nothing and queued forever —
          # GitHub is retiring that image.
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            artifact: macos
            command: npm run dist:mac
          - name: Windows
            os: windows-latest
            artifact: windows
            command: npm run dist:win
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            command: npm run dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json

      - name: Create .env from secret
        shell: bash
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: echo "DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}" > .env

      # `npm ci` runs Electron's postinstall, which downloads a ~100MB binary
      # over the network. That download is the flakiest step in the pipeline —
      # it has already failed a build on main with "RequestError: socket hang
      # up", and here it would take a release down with it. node_modules is
      # cleared between attempts because a half-finished install is not a
      # useful starting point for the next one.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3)"
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset GitHub secret arrives as an empty string, and
          # electron-builder reads a defined-but-empty CSC_LINK as "a
          # certificate is configured here", then fails resolving it as a path.
          # Drop the empty ones so it correctly sees no credentials.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done
          ${{ matrix.command }}

      - name: Verify macOS signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          found=0
          for APP in release/mac*/*.app; do
            [ -d "$APP" ] || continue
            found=$((found + 1))
            echo "── Verifying $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app bundle produced"
            exit 1
          fi
          APP=$(ls -d release/mac*/*.app | head -1)
          if codesign --display --verbose=2 "$APP" 2>&1 | grep -q "TeamIdentifier=not set"; then
            echo "::warning::Ad-hoc signed only (no Developer ID). Launches fine on Apple Silicon; browser downloads still need one approval via System Settings → Privacy & Security. The curl installer avoids that entirely. Add CSC_LINK + APPLE_* secrets to notarize."
          else
            echo "✅ Developer ID signed."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            electron-helper/release/*.dmg
            electron-helper/release/*.zip
            electron-helper/release/*.exe
            electron-helper/release/*.AppImage
            electron-helper/release/*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        working-directory: .
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        working-directory: .
        run: ls -la artifacts

      - name: Publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install on macOS — one command, no security prompts

          ```
          curl -fsSL https://unreleased.world/install.sh | sh
          ```

          Paste that into Terminal. It picks the right build for your Mac,
          verifies the app's signature, installs it and opens it.

          Why this is the easy path: these builds are code-signed but not
          notarized by Apple (notarization needs a paid Developer account).
          Anything a **browser** downloads gets tagged with macOS's quarantine
          flag, and Gatekeeper won't open a non-notarized app carrying that tag
          without a trip through System Settings. `curl` doesn't set that tag.
          The script is short and commented — read it at
          https://unreleased.world/install.sh before running it.

          ### Or download the app directly

          - **Apple Silicon (M1–M4):** `Unreleased-Presence-mac-arm64.dmg`
          - **Intel Mac:** `Unreleased-Presence-mac-x64.dmg`
          - **Windows:** `Unreleased-Presence-win-x64.exe`

          Drag it to Applications, double-click, then allow it in
          **System Settings → Privacy & Security → "Open Anyway"**.
          (On macOS 14 and earlier you can instead right-click → Open. Apple
          removed that shortcut in macOS 15.)

          ### "It says the app is damaged"

          It isn't. That message means macOS found no valid signature, and it
          came from older builds that shipped completely unsigned — which Apple
          Silicon refuses to run. **This release is signed**, so downloading it
          fixes the problem. If it somehow persists:

          ```
          xattr -dr com.apple.quarantine "/Applications/Unreleased Presence.app"
          ```

          ### Requirements

          - macOS 11 (Big Sur) or newer, or Windows 10/11
          - The Discord desktop app running on the same machine
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --notes-file notes.md
          fi
