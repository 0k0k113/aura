name: Build Electron Helper

on:
  push:
    paths:
      - "electron-helper/**"
      - ".github/workflows/build-electron-helper.yml"
  pull_request:
    paths:
      - "electron-helper/**"
      - ".github/workflows/build-electron-helper.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: electron-helper

jobs:
  # Fast feedback: typecheck + unit tests before spending macOS runner minutes.
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            artifact: macos-arm64
            command: npm run dist:mac:arm64
          - name: macOS Intel
            os: macos-13
            artifact: macos-intel
            command: npm run dist:mac:x64
          - name: Windows
            os: windows-latest
            artifact: windows
            command: npm run dist:win
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            command: npm run dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json

      - name: Create .env from secret
        shell: bash
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: echo "DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}" > .env

      - run: npm ci

      - name: Build
        shell: bash
        env:
          # Real signing when the certificate secrets exist; otherwise the
          # afterPack hook ad-hoc signs so Apple Silicon can still launch it.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.command }}

      # The whole point of the macOS work: an unsigned arm64 bundle is what
      # macOS reports as "damaged and can't be opened". Fail the build here
      # rather than shipping another broken download.
      - name: Verify macOS signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          APP=$(find release/mac* -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle produced"
            exit 1
          fi
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Signature|Identifier|TeamIdentifier" || true
          echo "✅ Signature valid — this bundle will not be reported as damaged."

      - uses: actions/upload-artifact@v4
        with:
          name: electron-helper-${{ matrix.artifact }}
          path: |
            electron-helper/release/*.dmg
            electron-helper/release/*.zip
            electron-helper/release/*.exe
            electron-helper/release/*.AppImage
            electron-helper/release/*.deb
          if-no-files-found: error
