name: Build Electron Helper

on:
  push:
    paths:
      - "electron-helper/**"
      - ".github/workflows/build-electron-helper.yml"
  pull_request:
    paths:
      - "electron-helper/**"
      - ".github/workflows/build-electron-helper.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: electron-helper

jobs:
  # Fast feedback: typecheck + unit tests before spending macOS runner minutes.
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json
      # `npm ci` runs Electron's postinstall, which downloads a ~100MB binary
      # over the network. That download is the flakiest step in the pipeline —
      # it has already failed a build on main with "RequestError: socket hang
      # up", and here it would take a release down with it. node_modules is
      # cleared between attempts because a half-finished install is not a
      # useful starting point for the next one.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3)"
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job builds BOTH architectures: electron-builder
          # cross-packages darwin-x64 on an Apple Silicon runner, and codesign
          # is arch-agnostic, so the Intel bundle is signed and verified here
          # too. A separate macos-13 job added nothing and queued forever —
          # GitHub is retiring that image.
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            artifact: macos
            command: npm run dist:mac
          - name: Windows
            os: windows-latest
            artifact: windows
            command: npm run dist:win
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            command: npm run dist:linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron-helper/package-lock.json

      - name: Create .env from secret
        shell: bash
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: echo "DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}" > .env

      # `npm ci` runs Electron's postinstall, which downloads a ~100MB binary
      # over the network. That download is the flakiest step in the pipeline —
      # it has already failed a build on main with "RequestError: socket hang
      # up", and here it would take a release down with it. node_modules is
      # cleared between attempts because a half-finished install is not a
      # useful starting point for the next one.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3)"
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build
        shell: bash
        env:
          # Real signing when the certificate secrets exist; otherwise the
          # afterPack hook ad-hoc signs so Apple Silicon can still launch it.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset GitHub secret arrives as an empty string, and
          # electron-builder reads a defined-but-empty CSC_LINK as "a
          # certificate is configured here", then fails resolving it as a path.
          # Drop the empty ones so it correctly sees no credentials.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done
          ${{ matrix.command }}

      # The whole point of the macOS work: an unsigned arm64 bundle is what
      # macOS reports as "damaged and can't be opened". Fail the build here
      # rather than shipping another broken download.
      - name: Verify macOS signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          # Verify EVERY bundle produced, not just the first one found — this
          # job builds both arm64 and Intel, and a `-print -quit` find left one
          # of them unchecked.
          found=0
          for APP in release/mac*/*.app; do
            [ -d "$APP" ] || continue
            found=$((found + 1))
            echo "── Verifying $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign --display --verbose=2 "$APP" 2>&1 | grep -E "^(Signature|Identifier|TeamIdentifier)" || true
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app bundle produced"
            exit 1
          fi
          echo "✅ $found bundle(s) verified — these will not be reported as damaged."

      - uses: actions/upload-artifact@v4
        with:
          name: electron-helper-${{ matrix.artifact }}
          path: |
            electron-helper/release/*.dmg
            electron-helper/release/*.zip
            electron-helper/release/*.exe
            electron-helper/release/*.AppImage
            electron-helper/release/*.deb
          if-no-files-found: error
